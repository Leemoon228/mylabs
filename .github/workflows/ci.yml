name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

  test:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid
          for attempt in {1..15}; do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/health

      - name: Test health endpoint
        run: |
          curl --silent --show-error --fail \
            --header "Accept: application/json" \
            http://127.0.0.1:8000/health

      - name: Test node creation and retrieval
        run: |
          curl --silent --show-error --fail \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"name":"CI test node","host":"127.0.0.1","port":8000}' \
            http://127.0.0.1:8000/nodes \
            --output node.json
          grep -q '"id":1' node.json
          grep -q '"name":"CI test node"' node.json
          curl --silent --show-error --fail http://127.0.0.1:8000/nodes/1 \
            --output retrieved-node.json
          grep -q '"name":"CI test node"' retrieved-node.json

      - name: Test error and metrics endpoints
        run: |
          curl --silent --show-error \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/nodes/999 \
            --output missing-node.json | grep -q '^404$'
          grep -q 'NOT_FOUND' missing-node.json
          curl --silent --show-error --fail http://127.0.0.1:8000/metrics \
            | grep -q 'http_requests_total'

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi
          cat api.log

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: server-monitoring-api:ci