services:
  prometheus:
    image: prom/prometheus:latest
    container_name: isrpo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: isrpo-grafana
    ports:
      - "3000:3000"