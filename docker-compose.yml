services:
  api:
    build: .
    container_name: isrpo-api
    ports:
      - "127.0.0.1:8000:8000"
  prometheus:
    image: prom/prometheus:latest
    container_name: isrpo-prometheus
    ports:
      - "9090:9090"
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: isrpo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data:
  prometheus-data: