services:
  api:
    build: .
    container_name: isrpo-api
    ports:
      - "127.0.0.1:8000:8000"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: isrpo-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - ./jaeger/ui-config.json:/etc/jaeger/ui-config.json:ro
    command:
      - --config=/etc/jaeger/config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: isrpo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: isrpo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: grafana/loki:latest
    container_name: isrpo-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yaml

  alloy:
    image: grafana/alloy:latest
    container_name: isrpo-alloy
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data: